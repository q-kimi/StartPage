server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # add_header d'un bloc location remplace celui du serveur: chaque bloc inclut donc le fichier
  include /etc/nginx/security.conf;

  # toujours revalider: la page et le service worker changent a chaque deploy
  location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security.conf;
    try_files $uri /index.html;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/security.conf;
  }
}
